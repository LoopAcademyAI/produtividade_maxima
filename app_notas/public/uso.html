<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utilização Entrelinhas</title><style>body{font:16px system-ui;max-width:820px;margin:4rem auto;padding:0 1rem;color:#1e293b}input,button{padding:.7rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:.7rem}</style><h1>Utilização</h1><p>Mostra apenas os eventos conservados, que podem não incluir todas as chamadas.</p><form id="form"><label>Código de convite <input type="password" name="codigo" required></label><button>Consultar</button></form><p id="msg" role="status"></p><div id="totais"></div><table><thead><tr><th>Nome</th><th>Hora</th><th>Categoria</th><th>ms</th></tr></thead><tbody id="linhas"></tbody></table><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#msg'),tbody=document.querySelector('#linhas'),tot=document.querySelector('#totais');tbody.replaceChildren();tot.textContent='';try{let r=await fetch('/api/uso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:e.target.codigo.value})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Erro');let counts={};for(const v of d.eventos){counts[v.nome]=(counts[v.nome]||0)+1;let tr=document.createElement('tr');for(const x of [v.nome,v.hora,v.categoria,v.ms]){let td=document.createElement('td');td.textContent=x;tr.append(td)}tbody.append(tr)}tot.textContent=Object.entries(counts).map(([n,c])=>`${n}: ${c}`).join(' · ');msg.textContent=`${d.eventos.length} eventos`;}catch(err){msg.textContent=err.message}};</script></html>
