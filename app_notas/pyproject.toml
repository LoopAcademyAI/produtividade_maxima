[project]
name = "entrelinhas-notas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openai>=1.50,<3",
    "python-dotenv>=1,<2",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "mcp_server.py"]
check_untyped_defs = true
